# 难度目标：每一关对"打到那里的玩家"应该有多难。
#
# 一格 = 一种配置（balance/kits.yaml 里的档）× 一种水平（机器人）。数字是胜率的下限和上限。
# `srpg difficulty` 按这张表把每一关跑一遍，逐格说达标、偏高还是偏低。
#
# 2026-11-25 用户定：主要验收格普通关 70%–80%，首领关 55%–65%；其余各格按同样的幅度
# 跟着下调。主要验收对象是"一般配置的普通玩家"，
# 其余几格用来看两头——熟练的会不会毫无压力，不花钱的玩家还能不能走。
#
# 2026-11-25 用户定：不看"新手"机器人。它是带着同样的队伍几乎随机地走，胜率比普通机器人
# 低五六十个点，不代表哪一类真实玩家，拿它当目标只会把关卡往简单里拉。机器人本身还在
# （srpg sim --bot novice），只是不再进这张表。
#
# 各类关卡：
#   teaching  教学关（1-1）：不该输。
#   intro     每章第一场正式的战斗：刚接触这一章的新东西，比后面的普通关松一档，
#             这样一章里是先松后紧、首领最难。
#   normal    普通关。
#   boss      首领关：这一章里最难的一场，普通玩家应该会输上几次。
#   side      可选的支线：比同章的普通关略松，免得把人劝退。
#   late_side 只有没拿到某位同伴的玩家才会遇到的支线（2-S）：一般和富裕配置的玩家已经有
#             喀戎，碰不到这一关，所以只看节俭配置，主要验收格也换成节俭配置。

runs: 400          # 每格模拟多少局。目标区间只有 10 个点宽，200 局的抽样误差约 ±6 个点，不够分辨
primary: [typical, casual]   # 主要验收的那一格；它不达标，这一关就算不达标
primary_for:                 # 个别关卡换一格验收
  "2-S": [frugal, casual]

kinds:
  teaching: ["1-1"]
  intro: ["1-2", "2-1"]
  boss: ["1-5", "2-5"]
  side: ["1-3"]
  late_side: ["2-S"]
  # 其余都是 normal

bands:
  teaching:
    typical: {casual: [0.95, 1.00], skilled: [0.98, 1.00]}
    frugal:  {casual: [0.95, 1.00]}
  intro:
    typical: {casual: [0.78, 0.88], skilled: [0.92, 1.00]}
    frugal:  {casual: [0.55, 0.80]}
  normal:
    typical: {casual: [0.70, 0.80], skilled: [0.88, 1.00]}
    frugal:  {casual: [0.45, 0.70]}
  boss:
    typical: {casual: [0.55, 0.65], skilled: [0.78, 0.92]}
    frugal:  {casual: [0.30, 0.55]}
  side:
    typical: {casual: [0.75, 0.88], skilled: [0.90, 1.00]}
    frugal:  {casual: [0.50, 0.78]}
  late_side:
    frugal:  {casual: [0.75, 0.88]}
