# 1-4 涅墨亚山谷的玩法目标（09-chapter-1 §3）：这一关要教会的东西有没有真的发生。
#
# 胜率不在这里。难度（每种玩家的胜率）统一写在 balance/difficulty.yaml，由 srpg difficulty
# 和工坊的"难度"页判定；这里只看玩法：回合数、有没有人被推下悬崖、过肩摔用没用上。
# 机器人是"一般配置的普通玩家"，和难度表的主要验收格是同一个。
#
# 每个指标：[下限, 上限]，或 {range: [下限, 上限], known_issue: "……"}。
battle: "1-4"
runs_min: 50           # 局数比这少：一律判"贴边"
bots:
  casual:
    timeout_rate: [0.00, 0.02]
    rounds_p50: [6, 10]
    rounds_mean: [6.0, 10.0]
    battles_with_fall: [0.50, 1.00]      # 这一关要教会"推下悬崖"
    battles_with_throw:                  # 过肩摔
      range: [0.50, 1.00]
      known_issue: "2026-11-25 实测 41%：普通机器人多半用盾击把狼推下去，不怎么摔。是机器人的偏好还是过肩摔不够划算，没有查。"
