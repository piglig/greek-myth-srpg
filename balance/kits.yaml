# 出战配置：玩家打到每一关时大概带着什么。
#
# 模拟器不知道营地里发生过什么。这份文件替它记着，分三档，对应 17-economy-shops.md
# 核算收入时的三种玩家：
#   frugal   只拿酬金、不卖东西、不打可选战。队伍只有剧情里加入的人，没有装备。
#   typical  卖材料、拿一半可选目标、打了 1-3。招两三个人，四个人各有两三件装备。
#   rich     全拿全卖。招到史诗英雄，主力装备齐全。
#
# 写法：每一档是按关卡先后排的一串变化，`at` 是"进入这一关之前"。打到哪一关，就把那一关
# 及之前的变化都叠上：
#   hire    从这时起在营地里的人（招募的，以及剧情里加入的喀戎、美狄亚）。累加。
#   party   跟主角出战的人，不含关卡文件里已经摆好的（阿塔兰忒一直是摆好的）。写了就换掉。
#   picks   技能树加点，按人。写了就换掉那个人的。
#   mods    装备带来的属性增减，按人。累加（换装就写差额）。
#   items   随身物品，按人。写了就换掉那个人的。
#   relics / boon / powers  主角的圣物、神赐、神力招式。写了就换掉。
#   level   这时大家大约几级，只用来核对加点花费（每级 1 点；阿塔兰忒、喀戎、美狄亚的
#           第一招不花点）。
#
# 每一步的花销都在注释里写了累计数，不超过那一档到那时的累计收入。价格取自
# prototype/core/campaign_checkpoint.gd；那边改了价，这里要跟着核一遍。
#
# 用法：srpg sim 2-3 --bot skilled -n 200 --kit typical
# 结果写到 balance/out/sim/<关>/variants/kit-<档名>/。

tiers:
  frugal:
    - at: "1-1"
      level: 1
      picks: {hero: [], atalanta: [vital_shot]}
    - at: "1-2"
      level: 2
      picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish]}
    - at: "1-5"                     # 没打可选的 1-3，经验少一场，喀戎也没入队
      level: 3
      picks: {hero: [iron_arm, shield_wall], atalanta: [vital_shot, patience]}
    - at: "2-1"
      level: 4
      relics: [lion_pelt]
      boon: moon_hunt
      picks: {hero: [iron_arm, stagger_fist], atalanta: [vital_shot, patience, skirmish]}
    - at: "2-2"
      level: 5
      hire: [{id: medea, def: medea}]
      party: [medea]
      picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
    - at: "2-4"
      level: 6
      picks:
        hero: [iron_arm, stagger_fist, heel_strike]
        atalanta: [vital_shot, patience, skirmish, leap_shot]
        medea: [frailty, kindling, solar_flame]

  typical:
    - at: "1-1"                     # 累计花 60：伊菲克勒斯 60
      level: 1
      hire: [{id: iphicles, def: bandit, name: 伊菲克勒斯, skills: [heavy_cut], tree: iphicles}]
      party: [iphicles]
      picks: {hero: [], atalanta: [vital_shot]}
    - at: "1-2"                     # 累计 230：法勒洛斯 80，皮甲（主角）90
      level: 2
      hire: [{id: phalerus, def: bandit_archer, name: 法勒洛斯, skills: [aimed_shot], tree: phalerus}]
      party: [iphicles, phalerus]
      picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish], iphicles: [iph_stand]}
      mods: {hero: {def: 2}}
    - at: "1-3"                     # 累计 425：短衣（阿塔兰忒）45，皮手套（主角）55，拳带（伊菲克勒斯）55，回复药 40
      level: 2
      mods: {atalanta: {hp: 3}, hero: {def: 1}, iphicles: {str: 1}}
      items: {hero: [item_potion]}
    - at: "1-4"                     # 累计 560：琥珀项链（主角）70，皮靴（阿塔兰忒）65。喀戎入队
      level: 3
      hire: [{id: chiron, def: chiron}]
      party: [chiron, iphicles]
      picks:
        hero: [iron_arm, shield_wall]
        atalanta: [vital_shot, patience]
        chiron: [purify_arrow, weak_point]
        phalerus: [pha_steady]
      mods: {hero: {hp: 5}, atalanta: {jump: 1}}
    - at: "1-5"                     # 累计 845：安开俄斯 150，胫甲（主角）95，回复药 40
      level: 4
      hire: [{id: ancaeus, def: bandit_chief, name: 安开俄斯, skills: [heavy_cut], tree: ancaeus}]
      party: [chiron, ancaeus]
      picks:
        hero: [iron_arm, stagger_fist]
        atalanta: [vital_shot, patience, skirmish]
        chiron: [purify_arrow, weak_point, mentor_stagger]
      mods: {hero: {def: 2}}
      items: {hero: [item_potion], chiron: [item_potion]}
    - at: "2-1"                     # 累计 1070：旅人斗篷（喀戎）100，宽皮带（安开俄斯）75，解毒药 50
      level: 4
      relics: [lion_pelt]
      boon: moon_hunt
      picks: {ancaeus: [anc_split]}
      mods: {chiron: {wil: 2, hp: 3}, ancaeus: {hp: 2, str: 1}}
      items: {hero: [item_potion], chiron: [item_antidote]}
    - at: "2-2"                     # 累计 1215：青金坠（美狄亚）95，解毒药 50。美狄亚入队
      level: 5
      hire: [{id: medea, def: medea}]
      party: [chiron, medea]
      picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
      mods: {medea: {div: 2}}
      items: {hero: [item_potion], chiron: [item_antidote], medea: [item_antidote]}
    - at: "2-3"                     # 累计 1400：誓约指环（美狄亚）95，皮甲（喀戎）90
      level: 6
      picks:
        hero: [iron_arm, stagger_fist, heel_strike]
        atalanta: [vital_shot, patience, skirmish, leap_shot]
        chiron: [purify_arrow, weak_point, mentor_stagger, field_medicine]
      mods: {medea: {wil: 3}, chiron: {def: 2}}
    - at: "2-4"                     # 累计 1670：青铜胸甲（主角，换下皮甲，卖回 45）225，火油罐 90
      level: 7
      picks:
        hero: [iron_arm, stagger_fist, heel_strike, shield_wall]
        medea: [frailty, kindling, solar_flame]
      mods: {hero: {def: 3, hp: 4, move: -1}}
      items: {hero: [item_potion], chiron: [item_antidote], medea: [item_firepot]}

  rich:
    - at: "1-1"                     # 累计 60：伊菲克勒斯 60
      level: 1
      hire: [{id: iphicles, def: bandit, name: 伊菲克勒斯, skills: [heavy_cut], tree: iphicles}]
      party: [iphicles]
      picks: {hero: [], atalanta: [vital_shot]}
    - at: "1-2"                     # 累计 275：法勒洛斯 80，皮甲（主角）90，短衣（阿塔兰忒）45
      level: 2
      hire: [{id: phalerus, def: bandit_archer, name: 法勒洛斯, skills: [aimed_shot], tree: phalerus}]
      party: [iphicles, phalerus]
      picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish], iphicles: [iph_stand]}
      mods: {hero: {def: 2}, atalanta: {hp: 3}}
    - at: "1-3"                     # 累计 610：伊达斯 240，皮手套（主角）55，回复药 40
      level: 2
      hire: [{id: idas, def: bandit_chief, name: 伊达斯, skills: [heavy_cut], tree: idas}]
      party: [idas, phalerus]
      mods: {hero: {def: 1}}
      items: {hero: [item_potion]}
    - at: "1-4"                     # 累计 880：琥珀项链（主角）70，皮靴（阿塔兰忒）65，胫甲（主角）95，回复药 40。喀戎入队
      level: 3
      hire: [{id: chiron, def: chiron}]
      party: [chiron, idas]
      picks:
        hero: [iron_arm, shield_wall]
        atalanta: [vital_shot, patience]
        chiron: [purify_arrow, weak_point]
        idas: [idas_frame]
      mods: {hero: {hp: 5, def: 2}, atalanta: {jump: 1}}
      items: {hero: [item_potion], chiron: [item_potion]}
    - at: "1-5"                     # 累计 1150：铁臂甲（伊达斯）115，旅人斗篷（喀戎）100，拳带（阿塔兰忒）55
      level: 4
      picks:
        hero: [iron_arm, stagger_fist]
        atalanta: [vital_shot, patience, skirmish]
        chiron: [purify_arrow, weak_point, mentor_stagger]
        idas: [idas_frame, idas_knee]
      mods: {idas: {str: 2, def: 1, jump: -1}, chiron: {wil: 2, hp: 3}, atalanta: {str: 1}}
    - at: "2-1"                     # 累计 1425：宽皮带（伊达斯）75，猫头鹰小像（喀戎）110，回复药 40，解毒药 50
      level: 4
      relics: [lion_pelt]
      boon: moon_hunt
      mods: {idas: {hp: 2, str: 1}, chiron: {wil: 2, div: 1}}
      items: {hero: [item_potion], chiron: [item_antidote]}
    - at: "2-2"                     # 累计 1720：青金坠 95、祭司护符 200（都给美狄亚，护符换下青金坠前先都算上）。美狄亚入队
      level: 5
      hire: [{id: medea, def: medea}]
      party: [chiron, medea]
      picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
      mods: {medea: {div: 3, wil: 2}}
      items: {hero: [item_potion], chiron: [item_antidote], medea: [item_antidote]}
    - at: "2-3"                     # 累计 2035：青铜胸甲（主角，换下皮甲）225，火油罐 90
      level: 6
      picks:
        hero: [iron_arm, stagger_fist, heel_strike]
        atalanta: [vital_shot, patience, skirmish, leap_shot]
        chiron: [purify_arrow, weak_point, mentor_stagger, field_medicine]
        medea: [frailty, kindling, solar_flame]
      mods: {hero: {def: 3, hp: 4, move: -1}}
      items: {hero: [item_potion], chiron: [item_antidote], medea: [item_firepot]}
    - at: "2-4"                     # 累计 2310：飞翼凉鞋（阿塔兰忒，换下皮靴）180，誓约指环（美狄亚）95
      level: 7
      picks:
        hero: [iron_arm, stagger_fist, heel_strike, shield_wall]
        medea: [frailty, kindling, solar_flame, cinder_lance]
      mods: {atalanta: {move: 1}, medea: {wil: 3}}
