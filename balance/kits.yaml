# 出战配置：玩家打到每一关时大概带着什么。
#
# 模拟器不知道营地里发生过什么。这份文件替它记着，分三档：
#   frugal   只花通关酬金、不卖战利品、不打可选战。每隔一两关给主角添一件装备。
#   typical  卖材料、一半的可选目标、打可选战。上场的人各有三四件装备，带一两瓶药。
#   rich     全拿全卖。主力装备齐全。
#
# 原则（2026-11-25）：模拟一关，就用玩家打到那一关时能有的东西。不拿后面章节才出现的
# 东西来测，也不沿用前面章节偏弱的状态。
#
# 这里只写玩家**做了什么**，不写数字。属性、花销、收入、等级都由引擎按数据表算
# （prototype/data/tables 下的 goods、loot、recruits、campaign），并逐条核对：
#   - 买的东西那时行商有没有货；
#   - 招的人那时来了没有；
#   - 累计花的钱有没有超过那时累计挣到的；
#   - 穿的、带的东西手里有没有，一个部位是不是只穿了一件；
#   - 等级够不够学那些招式，点数是不是基本花掉了；
#   - 出战的人有没有超过这一章的名额；
#   - 圣物是不是来早了。
# 有一条对不上，模拟就不跑，报出是哪一关的哪一条。改了价格、掉落、招募条件之后，
# 跑一遍 `go test ./sim` 就知道这里哪一步要跟着改。
#
# 写法：
#   earns   这种玩家怎么挣钱：asides 是每场做到可选目标的机会，spoils 是卖不卖战利品
#           （none / materials / all），optional 是打不打可选的战斗。
#   steps   按关卡先后排的一串事，`at` 是"进入这一关之前"：
#     joins   剧情里加入的人（喀戎、美狄亚）
#     hire    招募的英雄（recruits.json 里的名字）。他们不上场，只来支援
#     support 这一关起带哪位英雄来支援（要先雇到）；写 none 表示不带
#     buy / sell   买和卖的东西（goods.json 里的名字）
#     party   跟主角出战的人，不含关卡里已经摆好的（阿塔兰忒一直是摆好的，占一个名额）
#     picks   技能树加点，按人，写了就换掉那个人的
#     wear    这个人身上的全部装备，按人，写了就换掉
#     items   这个人带的物品，按人，写了就换掉
#     relics / boon / powers   主角的圣物、神赐、神力招式
#
# 用法：srpg sim 2-3 --bot casual -n 200            （默认 typical）
#       srpg sim 2-3 --bot casual -n 200 --kit frugal
#       srpg sim 2-3 --bot casual -n 200 --kit none  （裸装，只有关卡文件里摆的人）

tiers:
  frugal:
    # 只花通关酬金，不卖战利品，不打可选战。买得起什么就给主角买什么，一件一件攒。
    earns: {asides: 0, spoils: none, optional: false}
    steps:
      - at: "1-1"
        picks: {hero: [], atalanta: [vital_shot]}
      - at: "1-2"
        buy: [leather]
        wear: {hero: [leather]}
        picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish]}
      - at: "1-5"                   # 没打可选的 1-3，经验少一场，喀戎也没入队
        buy: [glove_hide, tunic]
        wear: {hero: [leather, glove_hide], atalanta: [tunic]}
        picks: {hero: [iron_arm, shield_wall], atalanta: [vital_shot, patience]}
      - at: "2-1"                   # 第二章起可以带一位支援：雇最便宜的那位
        relics: [lion_pelt]
        boon: moon_hunt
        hire: [iphicles]
        support: iphicles
        # 雇来的人有主角一半的经验，够学前两步
        picks: {hero: [iron_arm, stagger_fist], atalanta: [vital_shot, patience, skirmish], iphicles: [iph_thick, iph_stride]}
      - at: "2-2"
        joins: [medea]
        party: [medea]
        buy: [greaves]
        wear: {hero: [leather, glove_hide, greaves]}
        picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
      - at: "2-3"
        buy: [necklace, item_potion]
        wear: {hero: [leather, glove_hide, greaves, necklace]}
        items: {hero: [item_potion]}
      - at: "2-4"
        buy: [fist_wrap]
        wear: {atalanta: [tunic, fist_wrap]}
        picks:
          hero: [iron_arm, stagger_fist, heel_strike]
          atalanta: [vital_shot, patience, skirmish, leap_shot]
          medea: [frailty, kindling, solar_flame]
      - at: "2-5"
        buy: [pendant]
        wear: {medea: [pendant]}

  typical:
    earns: {asides: 0.5, spoils: materials, optional: true}
    steps:
      - at: "1-1"                   # 起始的钱留着
        picks: {hero: [], atalanta: [vital_shot]}
      - at: "1-2"
        buy: [leather, glove_hide, tunic, fist_wrap]
        wear: {hero: [leather, glove_hide], atalanta: [tunic, fist_wrap]}
        picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish]}
      - at: "1-3"
        buy: [necklace, greaves, boots, item_potion]
        wear: {hero: [leather, glove_hide, greaves, necklace], atalanta: [tunic, fist_wrap, boots]}
        items: {hero: [item_potion]}
      - at: "1-4"                   # 喀戎入队，但第一章只有一个名额，留守
        joins: [chiron]
        buy: [cup, item_potion]
        wear: {atalanta: [tunic, fist_wrap, boots, cup]}
        items: {hero: [item_potion], atalanta: [item_potion]}
        picks:
          hero: [iron_arm, shield_wall]
          atalanta: [vital_shot, patience]
          chiron: [purify_arrow, weak_point]
      - at: "1-5"
        buy: [gauntlet]
        sell: [glove_hide]
        wear: {hero: [leather, gauntlet, greaves, necklace]}
        picks:
          hero: [iron_arm, stagger_fist]
          atalanta: [vital_shot, patience, skirmish]
          chiron: [purify_arrow, weak_point, mentor_stagger]
      - at: "2-1"                   # 第二章多一个名额，喀戎上场；雇一位弓手来支援
        relics: [lion_pelt]
        boon: moon_hunt
        hire: [phalerus]
        support: phalerus
        picks: {phalerus: [pha_steady, pha_far]}
        buy: [cloak_travel, greaves, owl, item_antidote]
        party: [chiron]
        wear: {chiron: [cloak_travel, greaves, owl]}
        items: {hero: [item_potion], atalanta: [item_potion], chiron: [item_antidote]}
      - at: "2-2"                   # 美狄亚入队，换下喀戎
        joins: [medea]
        buy: [pendant, tunic, item_antidote]
        party: [medea]
        wear: {medea: [pendant, tunic]}
        items: {hero: [item_potion], atalanta: [item_potion], medea: [item_antidote]}
        picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
      - at: "2-3"
        buy: [ring_oath, scale]
        sell: [leather]
        wear: {medea: [pendant, tunic, ring_oath], hero: [scale, gauntlet, greaves, necklace]}
        picks:
          hero: [iron_arm, stagger_fist, heel_strike]
          atalanta: [vital_shot, patience, skirmish, leap_shot]
          chiron: [purify_arrow, weak_point, mentor_stagger, field_medicine]
      - at: "2-4"
        buy: [wingfoot, item_firepot]
        sell: [boots]
        wear: {atalanta: [tunic, fist_wrap, wingfoot, cup]}
        items: {hero: [item_potion], atalanta: [item_potion], medea: [item_antidote, item_firepot]}
        picks:
          hero: [iron_arm, stagger_fist, heel_strike, shield_wall]
          medea: [frailty, kindling, solar_flame]

  rich:
    earns: {asides: 1, spoils: all, optional: true}
    steps:
      - at: "1-1"
        picks: {hero: [], atalanta: [vital_shot]}
      - at: "1-2"
        buy: [leather, glove_hide, tunic, fist_wrap, item_potion]
        wear: {hero: [leather, glove_hide], atalanta: [tunic, fist_wrap]}
        items: {hero: [item_potion]}
        picks: {hero: [iron_arm], atalanta: [vital_shot, skirmish]}
      - at: "1-3"
        buy: [necklace, greaves, boots, cup, item_potion]
        wear: {hero: [leather, glove_hide, greaves, necklace], atalanta: [tunic, fist_wrap, boots, cup]}
        items: {hero: [item_potion], atalanta: [item_potion]}
      - at: "1-4"                   # 喀戎入队，留守
        joins: [chiron]
        buy: [gauntlet]
        sell: [glove_hide]
        wear: {hero: [leather, gauntlet, greaves, necklace]}
        picks:
          hero: [iron_arm, shield_wall]
          atalanta: [vital_shot, patience]
          chiron: [purify_arrow, weak_point]
      - at: "1-5"                   # 主角换鳞甲，换下的皮甲给阿塔兰忒
        buy: [scale]
        sell: [tunic]
        wear: {hero: [scale, gauntlet, greaves, necklace], atalanta: [leather, fist_wrap, boots, cup]}
        picks:
          hero: [iron_arm, stagger_fist]
          atalanta: [vital_shot, patience, skirmish]
          chiron: [purify_arrow, weak_point, mentor_stagger]
      - at: "2-1"
        relics: [lion_pelt]
        boon: moon_hunt
        hire: [ancaeus, phalerus]
        support: ancaeus
        picks: {ancaeus: [anc_heavy, anc_step]}
        buy: [cloak_travel, greaves, owl, item_antidote]
        party: [chiron]
        wear: {chiron: [cloak_travel, greaves, owl]}
        items: {hero: [item_potion], atalanta: [item_potion], chiron: [item_antidote]}
      - at: "2-2"                   # 美狄亚入队，换下喀戎
        joins: [medea]
        buy: [amulet, ring_oath, tunic, item_antidote]
        party: [medea]
        wear: {medea: [amulet, ring_oath, tunic]}
        items: {hero: [item_potion], atalanta: [item_potion], medea: [item_antidote]}
        picks: {hero: [iron_arm, stagger_fist, shield_wall], medea: [frailty, kindling]}
      - at: "2-3"
        buy: [cuirass, item_firepot]
        sell: [scale]
        wear: {hero: [cuirass, gauntlet, greaves, necklace]}
        items: {hero: [item_potion], atalanta: [item_potion], medea: [item_antidote, item_firepot]}
        picks:
          hero: [iron_arm, stagger_fist, heel_strike]
          atalanta: [vital_shot, patience, skirmish, leap_shot]
          chiron: [purify_arrow, weak_point, mentor_stagger, field_medicine]
          medea: [frailty, kindling, solar_flame]
      - at: "2-4"
        buy: [wingfoot, red_thread]
        sell: [boots, gauntlet]
        wear: {atalanta: [leather, fist_wrap, wingfoot, cup], hero: [cuirass, red_thread, greaves, necklace]}
        picks:
          hero: [iron_arm, stagger_fist, heel_strike, shield_wall]
          medea: [frailty, kindling, solar_flame, cinder_lance]
